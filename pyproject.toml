[project]
name = "claude-informes"
version = "1.0.0"
description = "Un JSON por turno de Claude Code, escrito por un hook Stop"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claude_informes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
