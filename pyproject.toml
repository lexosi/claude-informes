[project]
name = "claude-informes"
version = "1.0.0"
description = "One JSON per Claude Code turn, written by a Stop hook"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claude_informes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "real_data: the test uses real data from the machine (outside git) and only runs where it exists; if it is missing, it FAILS with instructions, never skips. CI runs 'pytest -m \"not real_data\"'; the pre-push runs the whole suite. See the header of tests/conftest.py.",
]
