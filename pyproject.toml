[project]
name = "claude-informes"
version = "1.0.0"
description = "Un JSON por turno de Claude Code, escrito por un hook Stop"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claude_informes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "datos_reales: el test usa datos reales de la maquina (fuera de git) y solo corre donde existen; si faltan, FALLA con instrucciones, nunca skip. CI corre 'pytest -m \"not datos_reales\"'; el pre-push corre la suite entera. Ver la cabecera de tests/conftest.py.",
]
